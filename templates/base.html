<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.title }}</title>
  <meta name="description" content="{{ t.desc }}">
  {% block seo %}
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site_url }}/?lang={{ lang }}">
  {% for code in langs %}
  <link rel="alternate" hreflang="{{ code }}" href="{{ site_url }}/?lang={{ code }}">
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ site_url }}/">
  {% endblock %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ t.title }}">
  <meta property="og:description" content="{{ t.desc }}">
  <meta property="og:url" content="{{ site_url }}/?lang={{ lang }}">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="application/ld+json">
  {{ {"@context":"https://schema.org","@type":"WebSite","name":t.title,"url":site_url ~ "/","inLanguage":lang,"description":t.desc} | tojson }}
  </script>
</head>
<body>
  <header>
    <h1>{{ t.title }}</h1>
    <p>{{ t.subtitle }}</p>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>{{ t.footer }}</footer>
</body>
</html>
